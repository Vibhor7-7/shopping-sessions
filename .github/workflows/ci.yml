name: ci
on:
  push:
  pull_request:

# The scorer builds the Dockerfile on linux/amd64 and runs it with the flags in
# scripts/docker_run.sh. This does the same on a real x86-64 machine, which an
# Apple-silicon laptop can only emulate.
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 -o -w -E 'avx2|avx512f|avx512_vbmi2' /proc/cpuinfo | sort -u | tr '\n' ' '
      - name: Build the image
        run: docker build -t shopping-sessions:latest .
      - name: The probe's log on this machine (branch probe only; no fixtures here, its output is wrong on purpose)
        env:
          CPUS: 4
          MEM: 12g
        run: |
          cargo build --release --bin synth 2>&1 | tail -1
          target/release/synth --events 1000000 --clicks 250000 --seed 1 --output dev
          start=$(date +%s.%N)
          scripts/docker_run.sh dev out 2> probe.log || echo "docker run failed: $?"
          echo "docker run took $(echo "$(date +%s.%N) - $start" | bc) s; the log is $(wc -l < probe.log) lines, $(wc -c < probe.log) bytes"
          cat probe.log
          ls -la out/user_daily
          pip install --quiet polars
          python3 - <<'PY'
          import polars as pl
          df = pl.read_parquet("out/user_daily/*.parquet").sort(["user_id", "day"])
          print(df.shape)
          for row in df.head(6).iter_rows(named=True):
              text = row["top_category"]
              print(row["user_id"], row["day"], row["sessions"], row["events"], row["revenue_cents"], len(text) if text else None)
              if text:
                  print("   ", text)
          PY
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, baseline x86-64 and the scorer's AVX2 build
        # The delimiter scan has a loop that only some CPUs can run (src/scan.rs), and
        # hosted runners differ: the test log says whether this run tested it.
        run: |
          grep -m1 'model name' /proc/cpuinfo; grep -m1 -o -w -E 'avx2|avx512f|avx512_vbmi2' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          cargo test --release
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo test --release -- --nocapture
      - name: Fixtures, pipeline and reference, with tiny read blocks too, under either scan loop
        # Unset, the CPU decides (the line printed says what it got); SS_SCAN=narrow is the loop every CPU runs.
        run: |
          pip install --quiet polars
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release
          for scan in "" narrow; do
            echo "SS_SCAN=$scan: $(SS_SCAN=$scan target/release/pipeline fixtures/A1/input out 2>&1 | grep -o 'scan [a-z0-9-]*$')"
            SS_SCAN=$scan python3 scripts/run_fixtures.py fixtures -- target/release/pipeline
            SS_SCAN=$scan SS_JOB_BYTES=7 SS_BLOCK_BYTES=17 python3 scripts/run_fixtures.py fixtures -- target/release/pipeline
          done
          scripts/check_reference.sh
      - name: Pipeline and reference agree on a stand-in dataset
        run: |
          cargo build --release --bin synth 2>&1 | tail -1
          target/release/synth --events 1500000 --clicks 400000 --seed 21 --output data
          target/release/reference data ref
          for settings in "NCPU=4" "NCPU=3 SS_PERSON_BITS=3 SS_DEDUP_BITS=11" "NCPU=4 SS_JOB_BYTES=40000 SS_BLOCK_BYTES=3000" \
              "NCPU=4 SS_SCAN=narrow" "NCPU=2 SS_SCAN=narrow SS_JOB_BYTES=40000 SS_BLOCK_BYTES=3000"; do
            rm -rf out; env $settings target/release/pipeline data out 2>/dev/null
            echo "[$settings] $(python3 scripts/compare_exact.py out ref | tail -1)"
            python3 scripts/compare_exact.py out ref | tail -1 | grep -q MATCH
          done
      - name: Pipeline and reference agree when nearly every event has a user of its own
        # The table that numbers a partition's people then grows in the middle of the pass that
        # fills it (src/person.rs), which no generated dataset makes it do. BENCH.md, experiment 41.
        run: |
          python3 scripts/many_people.py many 60000 1
          target/release/reference many manyref
          for settings in "NCPU=4" "NCPU=1" "NCPU=3 SS_PERSON_BITS=1 SS_DEDUP_BITS=1" "NCPU=5 SS_PERSON_BITS=9 SS_DEDUP_BITS=7"; do
            rm -rf out; env $settings target/release/pipeline many out 2>/dev/null
            echo "[$settings] $(python3 scripts/compare_exact.py out manyref | tail -1)"
            python3 scripts/compare_exact.py out manyref | tail -1 | grep -q MATCH
          done
