name: bench
# Times this commit against another on a real x86-64 machine, the closest free
# thing to the scorer's Xeon. Both are built the way the scorer builds them
# (the Dockerfile's build stage), then run interleaved on a stand-in dataset
# from src/bin/synth.rs. Start it by hand:
#   gh workflow run bench.yml -f base=<commit> [-f events=20000000] [-f env_a=... -f env_b=...]
on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare against (A); this commit is B
        required: true
      events:
        description: Events in the dataset
        default: "20000000"
      runs:
        description: Runs of each side
        default: "7"
      env_a:
        description: Settings for A, e.g. SS_BLOCK_BYTES=131072
        default: ""
      env_b:
        description: Settings for B
        default: ""
      sweep:
        description: Settings to try on this commit, separated by ";" (empty = skip)
        default: ""
      sweep_threads:
        description: Thread counts for the sweep
        default: "4 1"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|L1d|L2|L3|Flags' | sed -E 's/(Flags:).*/\1 (see below)/'
          grep -m1 -o -w -E 'avx2|bmi2|avx512f|avx512bw|avx512_vbmi2' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          cat /sys/kernel/mm/transparent_hugepage/enabled; free -g | sed -n 2p; df -h . | tail -1
      - name: Build both the way the scorer does
        run: |
          mkdir -p bin
          docker build -q --target build -t head .
          docker cp "$(docker create head)":/rootfs/app/pipeline bin/head
          git worktree add -q ../base "${{ inputs.base }}"
          docker build -q --target build -t base ../base
          docker cp "$(docker create base)":/rootfs/app/pipeline bin/base 2>/dev/null || docker cp "$(docker create base)":/pipeline bin/base
          ls -la bin
      - name: Dataset
        run: |
          cargo build --release --bin synth --bin reference 2>&1 | tail -1
          target/release/synth --events 2000000 --clicks 500000 --seed 5 --output small
          target/release/synth --events ${{ inputs.events }} --clicks $(( ${{ inputs.events }} / 4 )) --seed 9 --output data
          du -sh data/events data/clicks data/links
      - name: Both agree with the reference on a 2M-event set
        run: |
          pip install --quiet polars
          target/release/reference small ref
          for side in base head; do
            rm -rf out; bin/$side small out 2>/dev/null
            echo "$side: $(python3 scripts/compare_exact.py out ref | tail -1)"
          done
          rm -rf out; bin/head small out 2>/dev/null; python3 scripts/compare_exact.py out ref | tail -1 | grep -q MATCH
      - name: Both scan loops give the same tables on the whole dataset
        # The wide loop (src/scan.rs) only runs on CPUs with AVX-512 VBMI2, and no
        # reference can check a dataset this size: the narrow loop is the check.
        # On a runner without those instructions this compares the narrow loop with itself, and says so.
        run: |
          SS_SCAN=narrow NCPU=4 bin/head data out_narrow 2> narrow.log
          NCPU=3 bin/head data out_default 2> default.log
          echo "compared: $(grep -o 'scan [a-z0-9-]*$' narrow.log) against $(grep -o 'scan [a-z0-9-]*$' default.log)"
          python3 scripts/same_output.py out_narrow out_default
          rm -rf out_narrow out_default
      - name: A/B, 4 threads
        env:
          NCPU: 4
          ENV_A: ${{ inputs.env_a }}
          ENV_B: ${{ inputs.env_b }}
        run: |
          cat data/events/* data/clicks/* data/links/* > /dev/null
          scripts/ab.sh data bin/base bin/head ${{ inputs.runs }}
      - name: A/B again, to see how much two measurements of one thing differ
        env:
          NCPU: 4
          ENV_A: ${{ inputs.env_a }}
          ENV_B: ${{ inputs.env_b }}
        run: scripts/ab.sh data bin/base bin/head ${{ inputs.runs }}
      - name: One thread, where the work per line shows without the other threads
        env:
          NCPU: 1
          ENV_A: ${{ inputs.env_a }}
          ENV_B: ${{ inputs.env_b }}
        run: scripts/ab.sh data bin/base bin/head 3
      - name: Where the CPU time goes (user, kernel, page faults), this commit
        run: |
          for threads in 4 1; do
            rm -rf out
            NCPU=$threads /usr/bin/time -f "NCPU=$threads: %e s wall, %U s user, %S s kernel, %R minor faults, %M KB peak" bin/head data out 2> time.log
            grep -E "NCPU=|inside links|links .* ms" time.log
          done
          grep -E "AnonHugePages|Hugepagesize" /proc/meminfo
      - name: Sweep of settings on this commit
        if: inputs.sweep != ''
        run: |
          for threads in ${{ inputs.sweep_threads }}; do
            echo "--- NCPU=$threads"
            NCPU=$threads scripts/sweep.sh data bin/head 5 "${{ inputs.sweep }}"
          done
      - name: The whole container, as the scorer times it
        run: |
          docker build -q -t shopping-sessions:latest .
          for i in 1 2 3 4 5; do
            rm -rf out
            start=$(date +%s%N)
            CPUS=4 MEM=12g scripts/docker_run.sh data out 2> err.log
            end=$(date +%s%N)
            echo "container wall $(( (end - start) / 1000000 )) ms; inside: $(grep -o 'total [0-9.]* ms' err.log)"
          done
          # docker_run.sh also starts a clean-up container; this is one bare `docker run`, as the scorer's clock sees it.
          mkdir -p bare && chmod 777 bare
          for i in 1 2 3 4 5; do
            sudo rm -rf bare/*
            start=$(date +%s%N)
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m --cpus 4 --memory 12g --user 1000:1000 \
              -v "$PWD/data":/data:ro -v "$PWD/bare":/output -e NCPU=4 shopping-sessions:latest 2> err.log
            end=$(date +%s%N)
            echo "bare docker run $(( (end - start) / 1000000 )) ms; inside: $(grep -o 'total [0-9.]* ms' err.log)"
          done
          start=$(date +%s%N); docker run --rm --network none shopping-sessions:latest true; end=$(date +%s%N)
          echo "docker run of 'true' in the image: $(( (end - start) / 1000000 )) ms"
